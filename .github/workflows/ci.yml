name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# On main (push events, branches: [main] above so github.ref is always
# refs/heads/main here): queue instead of racing, so every push still gets
# a completed run through to a GHCR push — without this, two pushes
# seconds apart run independently and whichever run happens to finish last
# wins the :latest tag, regardless of which commit is actually newer.
# On PR branches: cancel the superseded run instead — nothing gets pushed
# from a PR anyway (see the "Build and push" step's push: condition), so
# there's no completed-run guarantee to protect, only CI minutes to save
# on rapid-fire pushes to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # Builds each platform on its own native runner (arm64 on GitHub's native
  # ubuntu-24.04-arm runner, not amd64+QEMU emulation — much faster). On
  # push events, each pushes its layer to GHCR by digest only, untagged;
  # docker-merge below combines the two digests into the final tagged,
  # multi-arch manifest. On PRs, images are built but not pushed at all.
  docker-build:
    needs: typecheck-and-lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # GHCR requires an all-lowercase image name, but github.repository
      # preserves the owner's actual case (BaptisteBergmann/lepetitmonde) —
      # GitHub Actions expressions have no toLower(), so this has to be a
      # shell step.
      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # All app config (SITE_URL, SUPABASE_URL, VAPID_PUBLIC_KEY, etc.) is a
      # runtime env var, not a build arg (see Dockerfile) — so this image
      # works unmodified for anyone pulling it, including this maintainer's
      # own production deploy: each self-hoster sets their own values on the
      # container, no rebuild needed.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize platform name for artifact
        id: platform
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # Pushes by digest on main/branch pushes (untagged — docker-merge
      # assembles the real tags); builds only (no push) on pull requests,
      # since PR images aren't trusted and forked PRs can't write packages.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_COMMIT_SHA=${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) || 'type=cacheonly' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the amd64 and arm64 digests pushed above into one multi-arch
  # manifest under the real tags (latest, branch, short SHA).
  docker-merge:
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.sha_short }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
