<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votre lien de connexion</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f5f5f4; font-family:Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f4; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden;">
            <tr>
              <td style="padding:32px 32px 8px 32px; text-align:center;">
                <h1 style="margin:0; font-size:20px; color:#1c1917;">Le petit monde</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0 32px; color:#292524; font-size:15px; line-height:1.6;">
                <p style="margin:16px 0;">Bonjour,</p>
                <p style="margin:16px 0;">
                  Cliquez sur le bouton ci-dessous pour vous connecter à Le petit monde.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px; text-align:center;">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink&next=/"
                  style="display:inline-block; background-color:#1c1917; color:#ffffff; text-decoration:none; font-size:15px; font-weight:600; padding:12px 28px; border-radius:8px;"
                >
                  Me connecter
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px 32px; color:#78716c; font-size:13px; line-height:1.6;">
                <p style="margin:16px 0;">
                  Si vous n'êtes pas à l'origine de cette demande, vous pouvez ignorer cet email sans risque.
                </p>
                <p style="margin:16px 0;">Ce lien expire dans 1 heure.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
