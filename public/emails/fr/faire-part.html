<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faire-part</title>
    <!--[if !mso]><!-->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--<![endif]-->
  </head>
  <body style="margin:0; padding:0; background-color:#fbf4ec; font-family:'DM Sans', Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fbf4ec; padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#fffdf8; border:1px solid rgba(43,53,66,0.12); border-radius:20px; overflow:hidden;">
            <tr>
              <td style="padding:36px 32px 0 32px; text-align:center;">
                <p style="margin:0; font-family:'Fraunces', Georgia, 'Times New Roman', serif; font-style:italic; font-weight:500; font-size:22px; color:#2b3542;">Le petit monde</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 0 32px;">
                <div style="height:1px; width:40px; margin:0 auto; background-color:#bba592;"></div>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 0 32px; color:#2b3542; font-size:15px; line-height:1.65;">
                <p style="margin:16px 0; font-family:'Fraunces', Georgia, 'Times New Roman', serif; font-style:italic; font-size:18px;">
                  {{BABY_NAME}} est arrivé·e !
                </p>
                <p style="margin:16px 0;">{{MESSAGE}}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 32px 32px; color:#6e6459; font-size:13px; line-height:1.6;">
                <p style="margin:16px 0;">
                  Retrouvez toutes les nouvelles de {{BABY_NAME}} sur son journal, Le petit monde.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:24px 0 0 0; font-family:'Fraunces', Georgia, 'Times New Roman', serif; font-style:italic; font-size:13px; color:#6e6459;">
            Le journal de bébé, à partager en famille
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
