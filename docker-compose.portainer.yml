services:
  app:
    image: 192.168.2.177:5000/lepetitmonde:latest
    pull_policy: always
    container_name: babyfeed
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Bounds a request spike to this container instead of it consuming the
    # whole host and starving Postgres/GoTrue/etc. running alongside it.
    # Tune against actual usage — these are conservative starting points,
    # not measured limits. max-old-space-size is kept below mem_limit so
    # Node's own GC kicks in before the container gets OOM-killed outright.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2
    environment:
      NODE_OPTIONS: --max-old-space-size=1536
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      CRON_SECRET: ${CRON_SECRET}
