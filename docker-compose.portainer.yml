services:
  app:
    # Multi-arch (amd64/arm64), built by CI on every push to main. Swap the
    # tag for a pinned commit SHA (see the GHCR package page) if you'd rather
    # not auto-update to :latest.
    image: ghcr.io/baptistebergmann/lepetitmonde:latest
    pull_policy: always
    container_name: lepetitmonde
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Bounds a request spike to this container instead of it consuming the
    # whole host and starving Postgres/GoTrue/etc. running alongside it.
    # Tune against actual usage — these are conservative starting points,
    # not measured limits. max-old-space-size is kept below mem_limit so
    # Node's own GC kicks in before the container gets OOM-killed outright.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2
    environment:
      NODE_OPTIONS: --max-old-space-size=1536
      SITE_URL: ${SITE_URL}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
